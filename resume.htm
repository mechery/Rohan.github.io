<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=assets/docs/resume.pdf" />
  <meta name="robots" content="noindex">
  <title>Redirecting to resume</title>
  <script>
    // Fallback: try to force-download if browser stays on this page
    (function(){
      try{
        const url = 'assets/docs/resume.pdf';
        fetch(url, {cache: 'no-store'}).then(r => r.blob()).then(b => {
          const obj = URL.createObjectURL(b);
          const a = document.createElement('a');
          a.href = obj; a.download = 'Rohan_Alias_resume.pdf';
          document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(obj);
        }).catch(()=>{ window.location = url; });
      }catch(e){ /* ignore */ }
    })();
  </script>
</head>
<body>
  Redirecting to resume...
  <p><a href="assets/docs/resume.pdf">Download resume</a></p>
</body>
</html>
